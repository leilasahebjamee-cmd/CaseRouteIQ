<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Know Me Agent</title><style>body{font:16px system-ui;max-width:720px;margin:3rem auto;padding:0 1rem;background:#f7f8fc;color:#14213d}label{display:block;margin-top:1rem;font-weight:600}input,select,textarea,button{box-sizing:border-box;width:100%;padding:.7rem;margin-top:.35rem;border:1px solid #bbc3d2;border-radius:.4rem;font:inherit}textarea{min-height:110px}button{background:#1955c7;color:white;border:0;margin-top:1.5rem;cursor:pointer}pre{white-space:pre-wrap;background:#101b32;color:#e9efff;padding:1rem;border-radius:.5rem;min-height:8rem}</style></head><body><h1>Know Me Agent</h1><p>Sample support triage: identity, service eligibility, and repeat-issue detection.</p><form id="request"><label>Customer<select name="customerId"><option value="cust-1001">Northwind Analytics — Enterprise</option><option value="cust-2002">Tailspin Toys — Professional</option></select></label><label>Channel<select name="channel"><option>email</option><option>portal</option><option>phone</option></select></label><label>Category<select name="category"><option value="authentication">Authentication</option><option value="billing">Billing</option><option value="technical">Technical</option></select></label><label>Issue summary<textarea name="summary">I cannot sign in to the Analytics dashboard</textarea></label><button>Assess request</button></form><h2>Decision</h2><pre id="output">Submit an issue to see the decision.</pre><script>document.querySelector('#request').addEventListener('submit',async(e)=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/assess',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});document.querySelector('#output').textContent=JSON.stringify(await r.json(),null,2)})</script></body></html>
