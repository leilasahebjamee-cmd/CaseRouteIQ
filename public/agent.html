<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Know Your Customer | Live demo</title><style>body{font:16px system-ui;max-width:720px;margin:3rem auto;padding:0 1rem;background:#f7f8fc;color:#14213d}a{color:#1955c7;font-weight:700;text-decoration:none}label{display:block;margin-top:1rem;font-weight:600}input,select,textarea,button{box-sizing:border-box;width:100%;padding:.7rem;margin-top:.35rem;border:1px solid #bbc3d2;border-radius:.4rem;font:inherit}textarea{min-height:110px}.actions{display:flex;gap:.75rem;margin-top:1.5rem}.actions button{margin:0}button{background:#1955c7;color:white;border:0;cursor:pointer}button.secondary{background:#45617d}pre{white-space:pre-wrap;background:#101b32;color:#e9efff;padding:1rem;border-radius:.5rem;min-height:8rem}.eyebrow{font-size:13px;margin-bottom:1.5rem}</style></head><body><div class="eyebrow"><a href="/">← Back to Know Your Customer</a></div><h1>Try Know Your Customer</h1><p>Assess a fictional customer support request. This public demo uses sample data only.</p><form id="request"><label>Customer<select name="customerId"><option value="cust-1001">Northwind Analytics — Enterprise</option><option value="cust-2002">Tailspin Toys — Professional</option></select></label><label>Channel<select name="channel"><option>email</option><option>portal</option><option>phone</option></select></label><label>Category<select name="category"><option value="authentication">Authentication</option><option value="billing">Billing</option><option value="technical">Technical</option></select></label><label>Issue summary<textarea name="summary">I cannot sign in to the Analytics dashboard</textarea></label><div class="actions"><button type="submit">Find self-help and assess</button><button class="secondary" type="button" id="create">Create support case</button></div></form><h2>Recommendation</h2><pre id="output">Assess an issue, then create a new case only if self-help did not resolve it.</pre><script>const form=document.querySelector('#request'),output=document.querySelector('#output');async function send(url){const data=Object.fromEntries(new FormData(form));const response=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});output.textContent=JSON.stringify(await response.json(),null,2)}form.addEventListener('submit',e=>{e.preventDefault();send('/api/assess')});document.querySelector('#create').addEventListener('click',()=>send('/api/cases'))</script></body></html>
